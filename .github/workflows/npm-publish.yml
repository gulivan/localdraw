name: Publish npm launcher

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish localdraw
    runs-on: ubuntu-latest
    environment: npm-publish
    defaults:
      run:
        working-directory: launcher

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use current npm with trusted publishing support
        run: npm install --global npm@latest

      - name: Check whether this launcher version is already published
        id: published
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "localdraw@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "localdraw@$VERSION is already published; nothing to do."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify matching native release assets
        if: steps.published.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-desktop"
          ASSETS=$(gh release view "$TAG" --repo gulivan/localdraw --json assets --jq '.assets[].name')
          for ASSET in \
            "localdraw-${VERSION}-darwin-arm64.dmg" \
            "localdraw-${VERSION}-darwin-x64.dmg" \
            "localdraw-${VERSION}-linux-x64.tar.gz" \
            "localdraw-${VERSION}-win-x64-portable.exe"; do
            grep -Fxq "$ASSET" <<<"$ASSETS"
            grep -Fxq "${ASSET}.sha256" <<<"$ASSETS"
          done

      - name: Verify package contents
        if: steps.published.outputs.published != 'true'
        run: npm pack --dry-run

      - name: Publish package
        if: steps.published.outputs.published != 'true'
        run: npm publish --access public --provenance
