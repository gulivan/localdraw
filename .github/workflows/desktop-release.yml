name: Desktop Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.5.1-desktop)
        required: true
        type: string
      publish:
        description: Publish a draft release after all artifacts succeed
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: Existing draft or published release tag
        required: true
        type: string
      publish:
        description: Publish the release after all artifacts succeed
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Match tag, desktop, and launcher versions
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-desktop}"
          DESKTOP_VERSION=$(node -p "require('./desktop/package.json').version")
          LAUNCHER_VERSION=$(node -p "require('./launcher/package.json').version")
          test "$TAG" = "v${VERSION}-desktop"
          test "$DESKTOP_VERSION" = "$VERSION"
          test "$LAUNCHER_VERSION" = "$VERSION"

  macos:
    name: macOS (${{ matrix.arch }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Build desktop app
        shell: bash
        run: |
          for attempt in 1 2; do
            if npm run build --prefix desktop; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Native macOS packaging failed; retrying once after hdiutil settles."
            sleep 10
          done
      - name: Verify desktop runtime and bundle
        working-directory: desktop
        run: |
          npm test
          npm run typecheck
          node scripts/run-electrobun-bun.mjs scripts/filesystem-workspace-smoke.ts
          npm run check:bundle
      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-desktop}"
          SOURCE=$(find desktop/artifacts -type f -name '*.dmg' | head -1)
          test -n "$SOURCE"
          ASSET="localdraw-${VERSION}-darwin-${{ matrix.arch }}.dmg"
          cp "$SOURCE" "$ASSET"
          shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Report and enforce release size
        shell: bash
        run: |
          ASSET="${{ steps.asset.outputs.asset }}"
          BYTES=$(stat -f%z "$ASSET")
          LIMIT=$((40 * 1024 * 1024))
          {
            echo "### macOS ${{ matrix.arch }} desktop size"
            echo
            echo "- Download: $(du -h "$ASSET" | cut -f1) ($BYTES bytes)"
            echo "- Frontend: $(du -sh desktop/build/stable-macos-*/LocalDraw.app/Contents/Resources/app/frontend | cut -f1)"
            echo "- Limit: 40 MiB"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$BYTES" -le "$LIMIT"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.asset.outputs.asset }}" \
            "${{ steps.asset.outputs.asset }}.sha256" --clobber

  linux:
    name: Linux (x64)
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-1 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            xvfb \
            zstd
      - name: Install dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Build desktop app
        run: npm run build --prefix desktop
      - name: Verify desktop runtime and bundle
        working-directory: desktop
        run: |
          npm test
          npm run typecheck
          node scripts/run-electrobun-bun.mjs scripts/filesystem-workspace-smoke.ts
          npm run check:bundle
      - name: Extract portable app bundle
        shell: bash
        run: |
          ARCHIVE=$(find desktop/artifacts -maxdepth 1 -type f -name '*-LocalDraw.tar.zst' | head -1)
          test -n "$ARCHIVE"
          mkdir -p desktop/portable-linux
          zstd --decompress --stdout "$ARCHIVE" | tar -xf - -C desktop/portable-linux
          APP_BIN=desktop/portable-linux/LocalDraw/bin
          test -x "$APP_BIN/launcher"
          mv "$APP_BIN/launcher" "$APP_BIN/launcher-bin"
          cp desktop/scripts/linux-launcher.sh "$APP_BIN/launcher"
          chmod +x "$APP_BIN/launcher"
          strip --strip-unneeded \
            "$APP_BIN/bun" \
            "$APP_BIN/launcher-bin" \
            "$APP_BIN/libNativeWrapper.so" \
            "$APP_BIN/libasar.so" \
            "$APP_BIN/zig-zstd"
          LD_LIBRARY_PATH="$APP_BIN" ldd "$APP_BIN/libNativeWrapper.so" | tee localdraw-linux-ldd.log
          ! grep -q 'not found' localdraw-linux-ldd.log
      - name: Smoke test packaged app
        shell: bash
        run: |
          APP_DIR=desktop/portable-linux/LocalDraw
          xvfb-run -a "$APP_DIR/bin/launcher" >localdraw-linux.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:32144/auth/status >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat localdraw-linux.log
              exit 1
            fi
            sleep 1
          done
          cat localdraw-linux.log
          exit 1
      - name: Prepare release asset
        id: asset
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          VERSION="${VERSION%-desktop}"
          BUNDLE_DIR=desktop/portable-linux/LocalDraw
          test -d "$BUNDLE_DIR"
          ASSET="localdraw-${VERSION}-linux-x64.tar.gz"
          tar -C "$BUNDLE_DIR" -czf "$ASSET" .
          sha256sum "$ASSET" > "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
      - name: Report and enforce release size
        shell: bash
        run: |
          ASSET="${{ steps.asset.outputs.asset }}"
          BYTES=$(stat -c%s "$ASSET")
          LIMIT=$((70 * 1024 * 1024))
          {
            echo "### Linux x64 desktop size"
            echo
            echo "- Download: $(du -h "$ASSET" | cut -f1) ($BYTES bytes)"
            echo "- Runtime: $(du -sh desktop/portable-linux/LocalDraw/bin | cut -f1)"
            echo "- Frontend: $(du -sh desktop/portable-linux/LocalDraw/Resources/app/frontend | cut -f1)"
            echo "- Limit: 70 MiB"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$BYTES" -le "$LIMIT"
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.asset.outputs.asset }}" \
            "${{ steps.asset.outputs.asset }}.sha256" --clobber

  windows:
    name: Windows (x64)
    needs: validate-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Build desktop app
        run: npm run build --prefix desktop
      - name: Verify desktop runtime and bundle
        shell: bash
        working-directory: desktop
        run: |
          npm test
          npm run typecheck
          node scripts/run-electrobun-bun.mjs scripts/filesystem-workspace-smoke.ts
          npm run check:bundle
      - name: Extract portable app bundle
        shell: pwsh
        run: |
          $archive = Get-ChildItem desktop/artifacts -File -Filter '*-LocalDraw.tar.zst' | Select-Object -First 1
          if (-not $archive) { throw 'No Windows portable archive found' }
          $portableDir = 'desktop/portable-win'
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          tar -xf $archive.FullName -C $portableDir
          if (-not (Test-Path "$portableDir/LocalDraw/bin/launcher.exe")) { throw 'Windows launcher not found' }
      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.event.release.tag_name }}"
          $version = $tag -replace '^v', '' -replace '-desktop$', ''
          $bundleDir = 'desktop/portable-win/LocalDraw'
          $portableExe = "localdraw-$version-win-x64-portable.exe"
          desktop/scripts/create-windows-portable-exe.ps1 `
            -Version $version `
            -BundlePath $bundleDir `
            -OutputPath $portableExe
          $hash = (Get-FileHash -Algorithm SHA256 $portableExe).Hash.ToLowerInvariant()
          "$hash  $portableExe" | Set-Content -NoNewline "$portableExe.sha256"
          "asset=$portableExe" >> $env:GITHUB_OUTPUT
      - name: Report and enforce release size
        shell: pwsh
        run: |
          $asset = "${{ steps.asset.outputs.asset }}"
          $bytes = (Get-Item $asset).Length
          $limit = 80 * 1024 * 1024
          $bundle = 'desktop/portable-win/LocalDraw'
          $directorySize = {
            param($path)
            $total = (Get-ChildItem $path -File -Recurse | Measure-Object Length -Sum).Sum
            '{0:N1} MiB' -f ($total / 1MB)
          }
          @(
            '### Windows x64 desktop size'
            ''
            "- Portable executable: $('{0:N1}' -f ($bytes / 1MB)) MiB ($bytes bytes)"
            "- Runtime: $(& $directorySize "$bundle/bin")"
            "- Frontend: $(& $directorySize "$bundle/Resources/app/frontend")"
            '- Limit: 80 MiB'
          ) | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($bytes -gt $limit) {
            throw "Windows desktop artifact exceeds the 80 MiB limit"
          }
      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.asset.outputs.asset }}" \
            "${{ steps.asset.outputs.asset }}.sha256" --clobber

  publish:
    name: Publish GitHub release
    needs: [macos, linux, windows]
    if: github.event_name == 'release' || inputs.publish == true
    runs-on: ubuntu-latest
    steps:
      - name: Publish release after every platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false

  publish-launcher:
    name: Publish npm launcher
    needs: publish
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
